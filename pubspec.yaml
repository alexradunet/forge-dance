name: forge_dance
description: Forge Dance Flutter app.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.6
  easy_localization: ^3.0.7
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  go_router: ^16.2.4
  image_picker: ^1.2.0
  json_annotation: ^4.12.0
  lottie: ^3.3.2
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.3
  shimmer: ^4.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/google_fonts/
    - assets/images/
    - assets/translations/
  fonts:
    - family: Bebas Neue
      fonts:
        - asset: assets/google_fonts/BebasNeue-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Variable.ttf
