include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.8

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    invalid_annotation_target: ignore
    unnecessary_null_in_if_null_operators: ignore

linter:
  rules:
