name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Run required checks
        run: bash tool/checks.sh

      - name: Build web release
        run: flutter build web --release --wasm --no-pub

  firebase-rules:
    name: Test Firestore rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test rules against the Firestore emulator
        run: bash tool/check_firebase_rules.sh

  integration:
    name: Authentication smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run authentication flow against Firebase emulators
        run: bash tool/check_integration.sh

  web-quality:
    name: Lighthouse web quality
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Audit release web build against Firebase emulators
        run: bash tool/check_web_quality.sh

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: build/lighthouse
          if-no-files-found: ignore

  widgetbook:
    name: Build Widgetbook v4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Generate Widgetbook catalogue
        working-directory: widgetbook
        run: dart run build_runner build

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Capture Widgetbook scenarios
        working-directory: widgetbook
        run: flutter test

      - name: Build Widgetbook web release
        working-directory: widgetbook
        run: flutter build web --release --no-pub

      - name: Upload labeled pilot to Widgetbook Cloud
        if: >-
          contains(github.event.pull_request.labels.*.name, 'widgetbook-cloud')
          && env.WIDGETBOOK_API_KEY != ''
        working-directory: widgetbook
        env:
          WIDGETBOOK_API_KEY: ${{ secrets.WIDGETBOOK_API_KEY }}
        run: |
          dart pub global activate widgetbook_cli 4.0.0-beta.13
          widgetbook cloud build push --api-key "$WIDGETBOOK_API_KEY"
