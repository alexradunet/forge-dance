version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      flutter-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /widgetbook
    schedule:
      interval: weekly
      day: monday
    groups:
      widgetbook-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
